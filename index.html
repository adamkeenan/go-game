<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Go Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="ai.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    body { font-family: system-ui, -apple-system, sans-serif; }
    input[type=range] { cursor: pointer; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useMemo, useEffect } = React;

    const EMPTY = null;
    const BLACK = 'black';
    const WHITE = 'white';

    // Game phases
    const SETUP = 'setup';
    const PLAYING = 'playing';
    const STONE_REMOVAL = 'stone_removal';
    const GAME_OVER = 'game_over';

    // Star points and handicap placement order per board size
    function getBoardInfo(boardSize) {
      if (boardSize === 9) {
        return {
          starPoints: [
            { row: 2, col: 2 }, { row: 2, col: 6 },
            { row: 6, col: 2 }, { row: 6, col: 6 },
            { row: 4, col: 4 }
          ],
          // Standard handicap placement order for 9x9
          handicapPoints: [
            { row: 2, col: 6 }, // 1 - upper right
            { row: 6, col: 2 }, // 2 - lower left
            { row: 6, col: 6 }, // 3 - lower right
            { row: 2, col: 2 }, // 4 - upper left
            { row: 4, col: 4 }, // 5 - center
            { row: 2, col: 4 }, // 6 - upper middle
            { row: 4, col: 2 }, // 7 - middle left
            { row: 4, col: 6 }, // 8 - middle right
            { row: 6, col: 4 }, // 9 - lower middle
          ]
        };
      } else {
        // 13x13: star points at rows/cols 3, 6, 9 (0-indexed)
        return {
          starPoints: [
            { row: 3, col: 3 }, { row: 3, col: 6 }, { row: 3, col: 9 },
            { row: 6, col: 3 }, { row: 6, col: 6 }, { row: 6, col: 9 },
            { row: 9, col: 3 }, { row: 9, col: 6 }, { row: 9, col: 9 },
          ],
          // Standard handicap placement order for 13x13
          handicapPoints: [
            { row: 3, col: 9 },  // 1 - upper right
            { row: 9, col: 3 },  // 2 - lower left
            { row: 9, col: 9 },  // 3 - lower right
            { row: 3, col: 3 },  // 4 - upper left
            { row: 6, col: 6 },  // 5 - center
            { row: 3, col: 6 },  // 6 - upper middle
            { row: 6, col: 3 },  // 7 - middle left
            { row: 6, col: 9 },  // 8 - middle right
            { row: 9, col: 6 },  // 9 - lower middle
          ]
        };
      }
    }

    function GoGame() {
      // Setup settings
      const [boardSize, setBoardSize] = useState(9);
      const [komi, setKomi] = useState(6.5);
      const [handicap, setHandicap] = useState(0);

      // Game mode settings
      const [gameMode, setGameMode] = useState('two-player');
      const [humanColor, setHumanColor] = useState(BLACK);

      // Game state
      const [board, setBoard] = useState(() =>
        Array(9).fill(null).map(() => Array(9).fill(EMPTY))
      );
      const [currentPlayer, setCurrentPlayer] = useState(BLACK);
      const [captures, setCaptures] = useState({ black: 0, white: 0 });
      const [previousBoard, setPreviousBoard] = useState(null);
      const [consecutivePasses, setConsecutivePasses] = useState(0);
      const [gamePhase, setGamePhase] = useState(SETUP);
      const [markedDead, setMarkedDead] = useState(new Set());
      const [showPassConfirm, setShowPassConfirm] = useState(false);
      const [finalScore, setFinalScore] = useState(null);
      const [history, setHistory] = useState([]);

      // Get all connected stones of the same color (flood fill)
      const getGroup = useCallback((boardState, row, col, color, bs, visited = new Set()) => {
        const key = `${row},${col}`;
        if (visited.has(key)) return [];
        if (row < 0 || row >= bs || col < 0 || col >= bs) return [];
        if (boardState[row][col] !== color) return [];

        visited.add(key);
        const group = [{ row, col }];

        const neighbors = [
          [row - 1, col], [row + 1, col],
          [row, col - 1], [row, col + 1]
        ];

        for (const [nr, nc] of neighbors) {
          group.push(...getGroup(boardState, nr, nc, color, bs, visited));
        }

        return group;
      }, []);

      // Count liberties for a group
      const countLiberties = useCallback((boardState, group, bs) => {
        const liberties = new Set();

        for (const { row, col } of group) {
          const neighbors = [
            [row - 1, col], [row + 1, col],
            [row, col - 1], [row, col + 1]
          ];

          for (const [nr, nc] of neighbors) {
            if (nr >= 0 && nr < bs && nc >= 0 && nc < bs) {
              if (boardState[nr][nc] === EMPTY) {
                liberties.add(`${nr},${nc}`);
              }
            }
          }
        }

        return liberties.size;
      }, []);

      // Check if boards are equal (for ko rule)
      const boardsEqual = useCallback((board1, board2, bs) => {
        if (!board1 || !board2) return false;
        for (let i = 0; i < bs; i++) {
          for (let j = 0; j < bs; j++) {
            if (board1[i][j] !== board2[i][j]) return false;
          }
        }
        return true;
      }, []);

      // Deep copy board
      const copyBoard = useCallback((boardState) => {
        return boardState.map(row => [...row]);
      }, []);

      // Save current state to history (before applying a move)
      const saveToHistory = useCallback(() => {
        setHistory(prev => [...prev, {
          board: copyBoard(board),
          currentPlayer,
          captures: { ...captures },
          previousBoard: previousBoard ? copyBoard(previousBoard) : null,
          consecutivePasses,
          gamePhase,
          markedDead: Array.from(markedDead)
        }]);
      }, [board, currentPlayer, captures, previousBoard, consecutivePasses, gamePhase, markedDead, copyBoard]);

      // Try to place a stone and return the new board state (or null if invalid)
      const tryPlaceStone = useCallback((boardState, row, col, color, bs) => {
        if (boardState[row][col] !== EMPTY) return null;

        const newBoard = copyBoard(boardState);
        newBoard[row][col] = color;

        const opponent = color === BLACK ? WHITE : BLACK;
        let capturedStones = 0;

        const neighbors = [
          [row - 1, col], [row + 1, col],
          [row, col - 1], [row, col + 1]
        ];

        const checkedGroups = new Set();
        for (const [nr, nc] of neighbors) {
          if (nr >= 0 && nr < bs && nc >= 0 && nc < bs) {
            if (newBoard[nr][nc] === opponent) {
              const groupKey = `${nr},${nc}`;
              if (!checkedGroups.has(groupKey)) {
                const group = getGroup(newBoard, nr, nc, opponent, bs);
                group.forEach(g => checkedGroups.add(`${g.row},${g.col}`));

                if (countLiberties(newBoard, group, bs) === 0) {
                  for (const { row: gr, col: gc } of group) {
                    newBoard[gr][gc] = EMPTY;
                    capturedStones++;
                  }
                }
              }
            }
          }
        }

        const ownGroup = getGroup(newBoard, row, col, color, bs);
        if (countLiberties(newBoard, ownGroup, bs) === 0) {
          if (capturedStones === 0) {
            return null;
          }
        }

        return { newBoard, capturedStones };
      }, [copyBoard, getGroup, countLiberties]);

      // Place a stone
      const placeStone = useCallback((row, col) => {
        if (gamePhase !== PLAYING) return;

        const result = tryPlaceStone(board, row, col, currentPlayer, boardSize);
        if (!result) return;

        const { newBoard, capturedStones } = result;

        if (boardsEqual(newBoard, previousBoard, boardSize)) return;

        saveToHistory();
        setPreviousBoard(copyBoard(board));
        setBoard(newBoard);
        setCaptures(prev => ({
          ...prev,
          [currentPlayer]: prev[currentPlayer] + capturedStones
        }));
        setCurrentPlayer(currentPlayer === BLACK ? WHITE : BLACK);
        setConsecutivePasses(0);
      }, [board, currentPlayer, gamePhase, previousBoard, boardSize, tryPlaceStone, boardsEqual, copyBoard, saveToHistory]);

      // Pass turn
      const handlePass = useCallback(() => {
        if (gamePhase !== PLAYING) return;

        setShowPassConfirm(false);
        saveToHistory();
        const newPasses = consecutivePasses + 1;

        if (newPasses >= 2) {
          setGamePhase(STONE_REMOVAL);
        } else {
          setConsecutivePasses(newPasses);
          setCurrentPlayer(currentPlayer === BLACK ? WHITE : BLACK);
        }
      }, [gamePhase, consecutivePasses, currentPlayer, saveToHistory]);

      // Toggle dead stone marking
      const toggleDeadStone = useCallback((row, col) => {
        if (gamePhase !== STONE_REMOVAL) return;
        if (board[row][col] === EMPTY) return;

        saveToHistory();
        const group = getGroup(board, row, col, board[row][col], boardSize);
        const newMarked = new Set(markedDead);

        const firstKey = `${group[0].row},${group[0].col}`;
        const isCurrentlyMarked = markedDead.has(firstKey);

        for (const { row: gr, col: gc } of group) {
          const key = `${gr},${gc}`;
          if (isCurrentlyMarked) {
            newMarked.delete(key);
          } else {
            newMarked.add(key);
          }
        }

        setMarkedDead(newMarked);
      }, [gamePhase, board, markedDead, boardSize, getGroup, saveToHistory]);

      // Calculate territory using flood fill
      const calculateTerritory = useCallback((boardState, deadStones, bs) => {
        const visited = new Set();
        const territory = { black: 0, white: 0 };

        const floodFillTerritory = (startRow, startCol) => {
          const emptyPoints = [];
          const borderingColors = new Set();
          const stack = [[startRow, startCol]];
          const localVisited = new Set();

          while (stack.length > 0) {
            const [row, col] = stack.pop();
            const key = `${row},${col}`;

            if (localVisited.has(key)) continue;
            if (row < 0 || row >= bs || col < 0 || col >= bs) continue;

            const stone = boardState[row][col];
            const isDead = deadStones.has(key);

            if (stone !== EMPTY && !isDead) {
              borderingColors.add(stone);
              continue;
            }

            localVisited.add(key);
            if (stone === EMPTY) {
              emptyPoints.push({ row, col });
            }

            stack.push([row - 1, col], [row + 1, col], [row, col - 1], [row, col + 1]);
          }

          localVisited.forEach(k => visited.add(k));

          if (borderingColors.size === 1) {
            const owner = [...borderingColors][0];
            return { owner, points: emptyPoints.length };
          }

          return { owner: null, points: 0 };
        };

        for (let row = 0; row < bs; row++) {
          for (let col = 0; col < bs; col++) {
            const key = `${row},${col}`;
            if (visited.has(key)) continue;
            if (boardState[row][col] !== EMPTY) continue;

            const result = floodFillTerritory(row, col);
            if (result.owner) {
              territory[result.owner] += result.points;
            }
          }
        }

        return territory;
      }, []);

      // Finalize score
      const finalizeScore = useCallback(() => {
        saveToHistory();
        let blackDeadCount = 0;
        let whiteDeadCount = 0;

        markedDead.forEach(key => {
          const [row, col] = key.split(',').map(Number);
          if (board[row][col] === BLACK) blackDeadCount++;
          if (board[row][col] === WHITE) whiteDeadCount++;
        });

        const territory = calculateTerritory(board, markedDead, boardSize);

        const blackScore = territory.black + captures.black + whiteDeadCount;
        const whiteScore = territory.white + captures.white + blackDeadCount + komi;

        setFinalScore({
          black: {
            territory: territory.black,
            prisoners: captures.black + whiteDeadCount,
            total: blackScore
          },
          white: {
            territory: territory.white,
            prisoners: captures.white + blackDeadCount,
            komi: komi,
            total: whiteScore
          },
          winner: blackScore > whiteScore ? BLACK : (whiteScore > blackScore ? WHITE : 'tie')
        });

        setGamePhase(GAME_OVER);
      }, [board, markedDead, captures, boardSize, komi, calculateTerritory, saveToHistory]);

      // Undo last move
      const handleUndo = useCallback(() => {
        if (history.length === 0) return;
        const prevState = history[history.length - 1];
        setHistory(prev => prev.slice(0, -1));
        setBoard(prevState.board);
        setCurrentPlayer(prevState.currentPlayer);
        setCaptures(prevState.captures);
        setPreviousBoard(prevState.previousBoard);
        setConsecutivePasses(prevState.consecutivePasses);
        setGamePhase(prevState.gamePhase);
        setMarkedDead(new Set(prevState.markedDead));
        setShowPassConfirm(false);
        setFinalScore(null);
      }, [history]);

      // Start game from setup screen
      const startGame = useCallback(() => {
        const { handicapPoints } = getBoardInfo(boardSize);
        const newBoard = Array(boardSize).fill(null).map(() => Array(boardSize).fill(EMPTY));

        const count = Math.min(handicap, handicapPoints.length);
        for (let i = 0; i < count; i++) {
          const { row, col } = handicapPoints[i];
          newBoard[row][col] = BLACK;
        }

        setBoard(newBoard);
        setCurrentPlayer(handicap > 0 ? WHITE : BLACK);
        setCaptures({ black: 0, white: 0 });
        setPreviousBoard(null);
        setConsecutivePasses(0);
        setGamePhase(PLAYING);
        setMarkedDead(new Set());
        setShowPassConfirm(false);
        setFinalScore(null);
        setHistory([]);
      }, [boardSize, handicap]);

      // Return to setup menu
      const goToSetup = useCallback(() => {
        setGamePhase(SETUP);
        setHistory([]);
        setFinalScore(null);
        setShowPassConfirm(false);
      }, []);

      // Handle intersection click — block input when it is the computer's turn
      const handleIntersectionClick = useCallback((row, col) => {
        if (gameMode === 'vs-computer' && gamePhase === PLAYING) {
          const aiColor = humanColor === BLACK ? WHITE : BLACK;
          if (currentPlayer === aiColor) return;
        }
        if (gamePhase === PLAYING) {
          placeStone(row, col);
        } else if (gamePhase === STONE_REMOVAL) {
          toggleDeadStone(row, col);
        }
      }, [gamePhase, gameMode, humanColor, currentPlayer, placeStone, toggleDeadStone]);

      // Trigger the AI move whenever it becomes the computer's turn
      useEffect(() => {
        if (gameMode !== 'vs-computer') return;
        if (gamePhase !== PLAYING) return;
        const aiColor = humanColor === BLACK ? WHITE : BLACK;
        if (currentPlayer !== aiColor) return;

        const timer = setTimeout(() => {
          const move = window.GoAI.getBestMove(board, aiColor, boardSize, previousBoard);
          if (move) {
            placeStone(move.row, move.col);
          } else {
            handlePass();
          }
        }, 500);

        return () => clearTimeout(timer);
      }, [currentPlayer, gamePhase, gameMode, humanColor, board, boardSize, previousBoard, placeStone, handlePass]);

      // Star points for the current board size
      const { starPoints } = useMemo(() => getBoardInfo(boardSize), [boardSize]);

      // Board dimensions — scale cell size to fit screen
      const BOARD_PADDING = 24;
      const CELL_SIZE = boardSize === 9 ? 40 : 32;
      const STONE_SIZE = boardSize === 9 ? 36 : 28;
      const GRID_SIZE = CELL_SIZE * (boardSize - 1);
      const BOARD_TOTAL_SIZE = GRID_SIZE + (BOARD_PADDING * 2);

      const BG_STYLE = { background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)' };

      // ─── SETUP SCREEN ───────────────────────────────────────────────────────────
      if (gamePhase === SETUP) {
        return (
          <div className="min-h-screen flex flex-col items-center justify-center p-4" style={BG_STYLE}>
            <div className="w-full max-w-sm">
              <h1 className="text-3xl font-bold text-center text-amber-100 tracking-wider mb-8" style={{
                fontFamily: "'Noto Serif', Georgia, serif",
                textShadow: '2px 2px 4px rgba(0,0,0,0.5)'
              }}>
                碁 Go
              </h1>

              <div className="bg-black/30 rounded-2xl p-6 space-y-7">

                {/* Board Size */}
                <div>
                  <p className="text-amber-200/70 text-xs font-semibold mb-3 tracking-widest uppercase">Board Size</p>
                  <div className="flex gap-3">
                    {[9, 13].map(size => (
                      <button
                        key={size}
                        onClick={() => setBoardSize(size)}
                        className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all shadow-lg ${
                          boardSize === size
                            ? 'bg-amber-700 text-white ring-2 ring-amber-400'
                            : 'bg-slate-700/80 text-slate-200 hover:bg-slate-600'
                        }`}
                      >
                        {size}×{size}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Komi */}
                <div>
                  <p className="text-amber-200/70 text-xs font-semibold mb-3 tracking-widest uppercase">Komi</p>
                  <div className="flex gap-3">
                    {[0.5, 6.5].map(k => (
                      <button
                        key={k}
                        onClick={() => setKomi(k)}
                        className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all shadow-lg ${
                          komi === k
                            ? 'bg-amber-700 text-white ring-2 ring-amber-400'
                            : 'bg-slate-700/80 text-slate-200 hover:bg-slate-600'
                        }`}
                      >
                        {k}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Handicap */}
                <div>
                  <div className="flex justify-between items-center mb-3">
                    <p className="text-amber-200/70 text-xs font-semibold tracking-widest uppercase">Handicap</p>
                    <span className="text-amber-300 text-sm font-bold">
                      {handicap === 0 ? 'None' : `${handicap} stone${handicap > 1 ? 's' : ''}`}
                    </span>
                  </div>
                  <input
                    type="range"
                    min="0"
                    max="9"
                    value={handicap}
                    onChange={e => setHandicap(Number(e.target.value))}
                    className="w-full accent-amber-500"
                  />
                  <div className="flex justify-between text-amber-200/40 text-xs mt-1 px-0.5">
                    <span>0</span>
                    <span>9</span>
                  </div>
                  {handicap > 0 && (
                    <p className="text-amber-200/50 text-xs mt-2 text-center">
                      Black starts with {handicap} stone{handicap > 1 ? 's' : ''} placed — White plays first
                    </p>
                  )}
                </div>

                {/* Game Mode */}
                <div>
                  <p className="text-amber-200/70 text-xs font-semibold mb-3 tracking-widest uppercase">Game Mode</p>
                  <div className="flex gap-3">
                    {['two-player', 'vs-computer'].map(mode => (
                      <button
                        key={mode}
                        onClick={() => setGameMode(mode)}
                        className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all shadow-lg ${
                          gameMode === mode
                            ? 'bg-amber-700 text-white ring-2 ring-amber-400'
                            : 'bg-slate-700/80 text-slate-200 hover:bg-slate-600'
                        }`}
                      >
                        {mode === 'two-player' ? '2 Players' : 'vs Computer'}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Color picker — only shown when playing vs computer */}
                {gameMode === 'vs-computer' && (
                  <div>
                    <p className="text-amber-200/70 text-xs font-semibold mb-3 tracking-widest uppercase">Play as</p>
                    <div className="flex gap-3">
                      {[BLACK, WHITE].map(color => (
                        <button
                          key={color}
                          onClick={() => setHumanColor(color)}
                          className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition-all shadow-lg flex items-center justify-center gap-2 ${
                            humanColor === color
                              ? 'bg-amber-700 text-white ring-2 ring-amber-400'
                              : 'bg-slate-700/80 text-slate-200 hover:bg-slate-600'
                          }`}
                        >
                          <span
                            className="w-4 h-4 rounded-full flex-shrink-0"
                            style={color === BLACK
                              ? { background: 'radial-gradient(ellipse at 30% 30%, #555, #000)', border: '1px solid #555' }
                              : { background: 'radial-gradient(ellipse at 30% 30%, #fff, #ccc)', border: '1px solid #bbb' }
                            }
                          />
                          {color === BLACK ? 'Black' : 'White'}
                        </button>
                      ))}
                    </div>
                    <p className="text-amber-200/40 text-xs mt-2 text-center">
                      {humanColor === BLACK ? 'You play Black — you go first' : 'You play White — Computer goes first'}
                    </p>
                  </div>
                )}

                {/* Start Game */}
                <button
                  onClick={startGame}
                  className="w-full py-3 bg-amber-700 hover:bg-amber-600 text-white rounded-lg transition-all font-medium shadow-lg text-base tracking-wide"
                >
                  Start Game
                </button>
              </div>

              <div className="mt-5 text-amber-200/30 text-xs text-center">
                Japanese Rules
              </div>
            </div>
          </div>
        );
      }

      // ─── GAME SCREEN ────────────────────────────────────────────────────────────
      return (
        <div className="min-h-screen flex flex-col items-center justify-center p-4" style={BG_STYLE}>

          {/* Header */}
          <div className="w-full max-w-md mb-4">
            <h1 className="text-2xl font-bold text-center text-amber-100 tracking-wider" style={{
              fontFamily: "'Noto Serif', Georgia, serif",
              textShadow: '2px 2px 4px rgba(0,0,0,0.5)'
            }}>
              碁 Go
            </h1>
          </div>

          {/* Status Bar */}
          <div className="w-full max-w-md mb-3 px-2">
            <div className="flex justify-between items-center text-sm">
              {/* Black Info */}
              <div className={`flex items-center gap-2 px-3 py-2 rounded-lg transition-all duration-300 ${
                currentPlayer === BLACK && gamePhase === PLAYING ? 'bg-amber-900/50 ring-2 ring-amber-400' : 'bg-black/30'
              }`}>
                <div className="w-5 h-5 rounded-full bg-gradient-to-br from-gray-700 to-black shadow-lg border border-gray-600" />
                <span className="text-amber-100 font-medium">Black</span>
                <span className="text-amber-300 text-xs">⬤ {captures.black}</span>
              </div>

              {/* White Info */}
              <div className={`flex items-center gap-2 px-3 py-2 rounded-lg transition-all duration-300 ${
                currentPlayer === WHITE && gamePhase === PLAYING ? 'bg-amber-900/50 ring-2 ring-amber-400' : 'bg-black/30'
              }`}>
                <div className="w-5 h-5 rounded-full bg-gradient-to-br from-white to-gray-200 shadow-lg border border-gray-300" />
                <span className="text-amber-100 font-medium">White</span>
                <span className="text-amber-300 text-xs">⬤ {captures.white}</span>
              </div>
            </div>

            {/* Turn / Phase indicator */}
            <div className="mt-2 text-center">
              {gamePhase === PLAYING && (() => {
                const aiColor = gameMode === 'vs-computer' ? (humanColor === BLACK ? WHITE : BLACK) : null;
                const isAiTurn = aiColor && currentPlayer === aiColor;
                return (
                  <p className={`text-sm ${isAiTurn ? 'text-amber-400 animate-pulse' : 'text-amber-200'}`}>
                    {isAiTurn
                      ? `${currentPlayer === BLACK ? 'Black' : 'White'} — Computer is thinking…`
                      : `${currentPlayer === BLACK ? 'Black' : 'White'}'s turn`
                    }
                  </p>
                );
              })()}
              {gamePhase === STONE_REMOVAL && (
                <p className="text-amber-300 text-sm font-medium animate-pulse">
                  Mark dead stones, then finalize
                </p>
              )}
              {gamePhase === GAME_OVER && (
                <p className="text-amber-400 text-sm font-bold">Game Over</p>
              )}
            </div>
          </div>

          {/* Board */}
          <div
            className="relative rounded-xl shadow-2xl"
            style={{
              width: BOARD_TOTAL_SIZE,
              height: BOARD_TOTAL_SIZE,
              background: 'linear-gradient(145deg, #c4a35a 0%, #b8956e 50%, #a67c52 100%)',
              boxShadow: '0 20px 50px rgba(0,0,0,0.5), inset 0 2px 10px rgba(255,255,255,0.2)'
            }}
          >
            {/* Wood grain overlay */}
            <div className="absolute inset-0 rounded-xl opacity-20 pointer-events-none" style={{
              backgroundImage: `repeating-linear-gradient(
                90deg,
                transparent,
                transparent 20px,
                rgba(139, 90, 43, 0.3) 20px,
                rgba(139, 90, 43, 0.3) 21px
              )`
            }} />

            {/* SVG Grid */}
            <svg
              className="absolute pointer-events-none"
              style={{ left: BOARD_PADDING, top: BOARD_PADDING, width: GRID_SIZE, height: GRID_SIZE }}
            >
              {Array.from({ length: boardSize }).map((_, i) => (
                <line key={`h-${i}`} x1="0" y1={i * CELL_SIZE} x2={GRID_SIZE} y2={i * CELL_SIZE}
                  stroke="#4a3728" strokeWidth="1" />
              ))}
              {Array.from({ length: boardSize }).map((_, i) => (
                <line key={`v-${i}`} x1={i * CELL_SIZE} y1="0" x2={i * CELL_SIZE} y2={GRID_SIZE}
                  stroke="#4a3728" strokeWidth="1" />
              ))}
              {starPoints.map(({ row, col }) => (
                <circle key={`star-${row}-${col}`}
                  cx={col * CELL_SIZE} cy={row * CELL_SIZE} r="4" fill="#4a3728" />
              ))}
            </svg>

            {/* Intersections + stones */}
            {board.map((row, rowIndex) =>
              row.map((cell, colIndex) => {
                const isDead = markedDead.has(`${rowIndex},${colIndex}`);
                return (
                  <div
                    key={`${rowIndex}-${colIndex}`}
                    className="absolute cursor-pointer flex items-center justify-center"
                    onClick={() => handleIntersectionClick(rowIndex, colIndex)}
                    style={{
                      left: BOARD_PADDING + (colIndex * CELL_SIZE) - (CELL_SIZE / 2),
                      top: BOARD_PADDING + (rowIndex * CELL_SIZE) - (CELL_SIZE / 2),
                      width: CELL_SIZE,
                      height: CELL_SIZE
                    }}
                  >
                    {cell && (
                      <div
                        className={`rounded-full transition-all duration-200 flex items-center justify-center ${
                          isDead ? 'opacity-40 scale-90' : ''
                        }`}
                        style={{
                          width: STONE_SIZE,
                          height: STONE_SIZE,
                          background: cell === BLACK
                            ? 'radial-gradient(ellipse at 30% 20%, #555 0%, #222 40%, #000 100%)'
                            : 'radial-gradient(ellipse at 30% 20%, #fff 0%, #f0f0f0 40%, #ccc 100%)',
                          boxShadow: cell === BLACK
                            ? '3px 3px 6px rgba(0,0,0,0.6), inset -2px -2px 4px rgba(80,80,80,0.3)'
                            : '3px 3px 6px rgba(0,0,0,0.3), inset -2px -2px 4px rgba(150,150,150,0.5)',
                          border: cell === BLACK ? '1px solid #333' : '1px solid #bbb'
                        }}
                      >
                        {isDead && (
                          <span className="text-red-500 font-bold text-xl" style={{
                            textShadow: '0 0 4px rgba(255,0,0,0.5)'
                          }}>✕</span>
                        )}
                      </div>
                    )}
                  </div>
                );
              })
            )}
          </div>

          {/* Controls */}
          <div className="w-full max-w-md mt-4 px-2">
            {gamePhase === PLAYING && (
              <div className="flex gap-3 justify-center flex-wrap">
                {(() => {
                  const aiColor = gameMode === 'vs-computer' ? (humanColor === BLACK ? WHITE : BLACK) : null;
                  const isAiTurn = aiColor && currentPlayer === aiColor;
                  if (isAiTurn) return null;
                  return !showPassConfirm ? (
                    <button
                      onClick={() => setShowPassConfirm(true)}
                      className="px-6 py-2 bg-amber-800/80 hover:bg-amber-700 text-amber-100 rounded-lg transition-all text-sm font-medium shadow-lg"
                    >
                      Pass
                    </button>
                  ) : (
                    <div className="flex items-center gap-2 bg-amber-900/60 px-4 py-2 rounded-lg">
                      <span className="text-amber-100 text-sm">Pass turn?</span>
                      <button onClick={handlePass}
                        className="px-4 py-1 bg-green-700 hover:bg-green-600 text-white rounded text-sm">
                        Yes
                      </button>
                      <button onClick={() => setShowPassConfirm(false)}
                        className="px-4 py-1 bg-red-700 hover:bg-red-600 text-white rounded text-sm">
                        No
                      </button>
                    </div>
                  );
                })()}
                <button
                  onClick={handleUndo}
                  disabled={history.length === 0}
                  className="px-6 py-2 bg-slate-700/80 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-slate-100 rounded-lg transition-all text-sm font-medium shadow-lg"
                >
                  Undo
                </button>
                <button
                  onClick={goToSetup}
                  className="px-6 py-2 bg-slate-700/80 hover:bg-slate-600 text-slate-100 rounded-lg transition-all text-sm font-medium shadow-lg"
                >
                  New Game
                </button>
              </div>
            )}

            {gamePhase === STONE_REMOVAL && (
              <div className="flex flex-col gap-3 items-center">
                <p className="text-amber-200/80 text-xs text-center">
                  Tap stone groups to mark them as dead
                </p>
                <div className="flex gap-3">
                  <button
                    onClick={handleUndo}
                    disabled={history.length === 0}
                    className="px-6 py-2 bg-slate-700/80 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-slate-100 rounded-lg transition-all text-sm font-medium shadow-lg"
                  >
                    Undo
                  </button>
                  <button
                    onClick={finalizeScore}
                    className="px-6 py-2 bg-green-700 hover:bg-green-600 text-white rounded-lg transition-all text-sm font-medium shadow-lg"
                  >
                    Finalize Score
                  </button>
                  <button
                    onClick={goToSetup}
                    className="px-6 py-2 bg-slate-700/80 hover:bg-slate-600 text-slate-100 rounded-lg transition-all text-sm font-medium shadow-lg"
                  >
                    New Game
                  </button>
                </div>
              </div>
            )}

            {gamePhase === GAME_OVER && finalScore && (
              <div className="bg-black/40 rounded-xl p-4 backdrop-blur-sm">
                <div className="text-center mb-4">
                  <p className="text-2xl font-bold text-amber-300" style={{
                    fontFamily: "'Noto Serif', Georgia, serif"
                  }}>
                    {finalScore.winner === 'tie'
                      ? '🤝 Tie Game!'
                      : `${finalScore.winner === BLACK ? '⚫ Black' : '⚪ White'} Wins!`}
                  </p>
                </div>

                <div className="grid grid-cols-2 gap-4 text-sm mb-4">
                  <div className="bg-gray-900/50 rounded-lg p-3">
                    <div className="flex items-center gap-2 mb-2">
                      <div className="w-4 h-4 rounded-full bg-gradient-to-br from-gray-700 to-black" />
                      <span className="text-amber-100 font-medium">Black</span>
                    </div>
                    <div className="text-amber-200/80 text-xs space-y-1">
                      <p>Territory: {finalScore.black.territory}</p>
                      <p>Prisoners: {finalScore.black.prisoners}</p>
                      <p className="text-amber-300 font-bold pt-1 border-t border-amber-900">
                        Total: {finalScore.black.total}
                      </p>
                    </div>
                  </div>

                  <div className="bg-gray-100/10 rounded-lg p-3">
                    <div className="flex items-center gap-2 mb-2">
                      <div className="w-4 h-4 rounded-full bg-gradient-to-br from-white to-gray-200" />
                      <span className="text-amber-100 font-medium">White</span>
                    </div>
                    <div className="text-amber-200/80 text-xs space-y-1">
                      <p>Territory: {finalScore.white.territory}</p>
                      <p>Prisoners: {finalScore.white.prisoners}</p>
                      <p>Komi: +{finalScore.white.komi}</p>
                      <p className="text-amber-300 font-bold pt-1 border-t border-amber-900">
                        Total: {finalScore.white.total}
                      </p>
                    </div>
                  </div>
                </div>

                <div className="flex gap-3">
                  <button
                    onClick={handleUndo}
                    disabled={history.length === 0}
                    className="flex-1 px-6 py-3 bg-slate-700/80 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed text-slate-100 rounded-lg transition-all font-medium shadow-lg"
                  >
                    Undo
                  </button>
                  <button
                    onClick={goToSetup}
                    className="flex-1 px-6 py-3 bg-amber-700 hover:bg-amber-600 text-white rounded-lg transition-all font-medium shadow-lg"
                  >
                    Play Again
                  </button>
                </div>
              </div>
            )}
          </div>

          {/* Footer */}
          <div className="mt-4 text-amber-200/40 text-xs text-center">
            {boardSize}×{boardSize} • Japanese Rules • Komi {komi}{handicap > 0 ? ` • H${handicap}` : ''}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GoGame />);
  </script>
</body>
</html>
